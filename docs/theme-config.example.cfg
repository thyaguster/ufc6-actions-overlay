; Copy beside the installed overlay: UFC6/bin/ufc6-overlay-theme.cfg
; Default Settings > Theme > From config follows this file.
; Existing files are never overwritten by the overlay.
; Preset: Green, Blue, Red, Purple or Amber. All hex color overrides are optional.
[Theme]
Preset=Blue
Accent=#66B1FF
Background=#11161E
Surface=#1D2531
Border=#2A3544
Text=#DAE4F0
Muted=#B0B8C5

; Seeded on first launch only. Existing/saved client settings take priority.
[Appearance]
UIScale=100
FontSize=18
BoxStyle=Rounded
WindowSize=Compact
; UIScale: 50..300 in steps of 25. FontSize: 16, 18 or 20.
; BoxStyle: Rounded, Square, Outline, Pill or Octagon.
; WindowSize: Compact (6 rows), Expanded (9), Tall (up to 12).
